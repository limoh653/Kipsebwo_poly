{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="color: #2c3e50; border-bottom: 2px solid #f39c12; padding-bottom: 10px;">Record Fee Payment</h2>
    
    <div style="background: #fff3cd; padding: 15px; border-radius: 5px; margin-bottom: 20px; color: #856404;">
        <strong>Student:</strong> {{ student.name }} ({{ student.admission_number }})<br>
        <strong>Current Balance:</strong> Ksh {{ balance.balance }}
    </div>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Amount to Pay (Ksh)</label>
            <input type="number" name="amount" step="0.01" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Payment Mode</label>
            <select name="mode" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                <option value="Mpesa">Mpesa</option>
                <option value="Bank Cheque">Bank Cheque</option>
                <option value="Bank Deposit">Bank Deposit</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Reference Number (Mpesa Code/Cheque No)</label>
            <input type="text" name="reference_number" required placeholder="e.g. QRT890..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit" style="width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer;">
            Post Payment & Generate Receipt
        </button>
    </form>
</div>
{% endblock %}
